// Loader-independent code. Compiled against plain Minecraft (no Fabric or Forge)
// so nothing loader-specific can sneak in. The loader modules compile these same sources.
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'org.ow2.asm:asm:9.7'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.1'
    compileOnly "com.github.glitchfiend:TerraBlender-common:${minecraft_version}-${terrablender_version}"
}

sourceSets.main.resources.srcDir 'src/generated/resources'

configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}

artifacts {
    commonJava file('src/main/java')
    commonResources file('src/main/resources')
    commonResources file('src/generated/resources')
}
