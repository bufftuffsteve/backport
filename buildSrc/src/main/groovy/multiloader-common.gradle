// Settings shared by every module (common, fabric, forge, neoforge).
plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    // 1.20.1 targets Java 17. Pass -Pjava_toolchain=21 to build with a newer JDK (the jar still targets 17).
    toolchain.languageVersion = JavaLanguageVersion.of(project.findProperty('java_toolchain') ?: java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' } }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org/' },
                maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' })
        filter { includeGroup('org.parchmentmc.data') }
    }
    // TerraBlender
    exclusiveContent {
        forRepository { maven { name = 'Glitchfiend'; url = 'https://maven.minecraftforge.net/' } }
        filter { includeGroup('com.github.glitchfiend') }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${mod_id}" } }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.findProperty('description'),
            'credits'                      : credits,
            'java_version'                 : java_version,
            'fabric_version'               : project.findProperty('fabric_version') ?: '',
            'fabric_loader_min'            : project.findProperty('fabric_loader_min') ?: '',
            'forge_loader_version_range'   : project.findProperty('forge_loader_version_range') ?: '',
            'forge_min_version'            : project.findProperty('forge_min_version') ?: '',
            'neoforge_loader_version_range': project.findProperty('neoforge_loader_version_range') ?: '',
            'neoforge_min_version'         : project.findProperty('neoforge_min_version') ?: '',
    ]
    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
