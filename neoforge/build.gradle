plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
            logLevel = org.slf4j.event.Level.INFO
        }
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        // Data generation writes into the common module, so every loader ships the same files.
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', rootProject.file('common/src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // TerraBlender: required at runtime, so players need it installed too.
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"
}
